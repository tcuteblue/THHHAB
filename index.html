<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a202c">
  <link rel="apple-touch-icon" href="icon-192x192.png">
  <title>個人雲帳本</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 隱藏捲軸但可滾動 */
    ::-webkit-scrollbar { display: none; }
    html, body { -ms-overflow-style: none; scrollbar-width: none; background-color: #f3f4f6; overflow-x: hidden; }
    
    /* 滑動選單過渡效果 */
    .slide-menu {
      transition: transform 0.3s ease-in-out;
      transform: translateX(-100%);
    }
    .slide-menu.open {
      transform: translateX(0);
    }
    
    /* Switch 切換動畫 */
    .toggle-checkbox:checked { right: 0; border-color: #68D391; }
    .toggle-checkbox:checked + .toggle-label { background-color: #68D391; }
    .toggle-checkbox:checked + .toggle-label span.text-left { display: none; }
    .toggle-checkbox:checked + .toggle-label span.text-right { display: block; }
    .toggle-checkbox:not(:checked) + .toggle-label span.text-left { display: block; }
    .toggle-checkbox:not(:checked) + .toggle-label span.text-right { display: none; }

    /* 按鈕點擊動畫 */
    .btn-active:active { transform: scale(0.95); transition: transform 0.1s; }

    /* Toast 動畫 */
    .toast-enter { animation: slideInUp 0.3s forwards; }
    .toast-leave { animation: fadeOut 0.3s forwards; }
    @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    /* 遮罩動畫 */
    .fade-enter { animation: fadeIn 0.3s forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Loading 動畫 */
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid #fff;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body x-data="ledgerApp()" x-init="initApp()" class="text-gray-800 font-sans antialiased pb-20">

  <!-- 頂部導覽列 -->
  <header class="bg-gray-900 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center transition-colors duration-300" :class="{'bg-teal-700': currentLedger === 'studio', 'bg-gray-900': currentLedger === 'home'}">
    <div class="flex items-center">
      <button @click="menuOpen = true" class="text-xl mr-4 btn-active"><i class="fas fa-bars"></i></button>
      <h1 class="text-xl font-bold" x-text="currentLedger === 'home' ? '家用雲帳本' : '工作室帳本'"></h1>
    </div>
    <!-- 帳本切換 Switch -->
    <div class="relative inline-block w-16 mr-2 align-middle select-none transition duration-200 ease-in">
        <input type="checkbox" name="toggle" id="toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-all duration-300 shadow-sm" x-model="isStudioMode" @change="switchLedger()"/>
        <label for="toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-400 cursor-pointer relative shadow-inner">
            <span class="text-left text-xs text-white absolute font-bold h-full flex items-center pl-2">家</span>
            <span class="text-right text-xs text-white absolute font-bold h-full flex items-center right-0 pr-2">工</span>
        </label>
    </div>
  </header>

  <!-- 左側滑動選單 (更換圖示與名稱) -->
  <div class="fixed inset-0 bg-black bg-opacity-50 z-50 fade-enter" x-show="menuOpen" style="display: none;" @click="menuOpen = false"></div>
  <nav class="fixed inset-y-0 left-0 w-64 bg-white shadow-xl z-50 slide-menu flex flex-col" :class="{'open': menuOpen}">
    <div class="p-6 bg-gray-900 text-white flex justify-between items-center transition-colors duration-300" :class="{'bg-teal-700': currentLedger === 'studio', 'bg-gray-900': currentLedger === 'home'}">
      <h2 class="text-xl font-bold"><i class="fas fa-wallet mr-2"></i>功能選單</h2>
      <button @click="menuOpen = false" class="text-2xl btn-active"><i class="fas fa-times"></i></button>
    </div>
    <div class="flex-1 overflow-y-auto py-4">
      <!-- 原本的「雲端同步與更新」改為「雲端同步」 -->
      <a href="#" @click.prevent="currentView = 'sync'; menuOpen = false" class="block px-6 py-3 text-gray-700 hover:bg-gray-100 hover:text-blue-600 transition-colors border-b">
        <i class="fas fa-cloud-sync mr-3 w-5 text-center"></i>雲端同步
      </a>
      <a href="#" @click.prevent="currentView = 'list'; menuOpen = false" class="block px-6 py-3 text-gray-700 hover:bg-gray-100 hover:text-blue-600 transition-colors border-b">
        <i class="fas fa-list-ul mr-3 w-5 text-center"></i>交易明細
      </a>
      <a href="#" @click.prevent="currentView = 'stats'; menuOpen = false" class="block px-6 py-3 text-gray-700 hover:bg-gray-100 hover:text-blue-600 transition-colors border-b">
        <i class="fas fa-chart-pie mr-3 w-5 text-center"></i>圖表分析
      </a>
      <a href="#" @click.prevent="currentView = 'settings'; menuOpen = false" class="block px-6 py-3 text-gray-700 hover:bg-gray-100 hover:text-blue-600 transition-colors">
        <i class="fas fa-cog mr-3 w-5 text-center"></i>分類設定
      </a>
    </div>
    <div class="p-4 text-xs text-gray-400 text-center border-t">
      蔡宏和製作20261019
    </div>
  </nav>

  <!-- 主內容區 -->
  <main class="p-4 max-w-lg mx-auto w-full">
    
    <!-- 雲端同步頁面 -->
    <div x-show="currentView === 'sync'" x-cloak class="space-y-4">
      <div class="bg-white rounded-xl shadow p-5">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-gray-800"><i class="fas fa-cloud-download-alt text-blue-500 mr-2"></i>同步狀態</h2>
          <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full border">
             共 <span x-text="records.length" class="font-bold"></span> 筆
          </span>
        </div>
        
        <div class="text-sm text-gray-600 mb-6 bg-gray-50 p-3 rounded-lg border border-gray-100">
          <p class="flex items-center"><i class="far fa-clock mr-2 text-gray-400"></i>最後同步：<span x-text="lastSyncTime" class="ml-1 font-mono"></span></p>
          <template x-if="isDataStale()">
             <!-- 原本的「雲端有新資料，建議更新」 -->
             <p class="text-amber-500 mt-2 text-xs font-semibold flex items-center bg-amber-50 p-2 rounded"><i class="fas fa-exclamation-triangle mr-1"></i>雲端可能有新資料，建議同步</p>
          </template>
        </div>

        <div class="space-y-3">
            <div class="relative" x-data="{ openOptions: false }">
              <button @click="openOptions = !openOptions" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:bg-blue-700 active:bg-blue-800 btn-active flex justify-between items-center">
                <span><i class="fas fa-sync-alt mr-2"></i>選擇同步方式</span>
                <i class="fas fa-chevron-down text-sm transition-transform" :class="{'rotate-180': openOptions}"></i>
              </button>
              
              <div x-show="openOptions" @click.away="openOptions = false" class="absolute z-10 w-full mt-2 bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden fade-enter">
                 <!-- 🔴 本月同步 (紅色按鈕 + 閃電圖案) -->
                 <button @click="syncData('currentMonth'); openOptions = false" class="w-full text-left px-4 py-3 text-red-600 font-bold hover:bg-red-50 border-b flex items-center">
                    <i class="fas fa-bolt mr-2"></i>本月同步
                 </button>
                 
                 <!-- 🔄 歷年完整同步 -->
                 <button @click="syncData('all'); openOptions = false" class="w-full text-left px-4 py-3 text-gray-700 hover:bg-gray-50 border-b flex items-center">
                    <i class="fas fa-history mr-2 text-gray-400"></i>歷年完整同步 (較耗時)
                 </button>
                 
                 <!-- 📅 同步指定月份 (原：抓取指定月份) -->
                 <div class="px-4 py-3 bg-gray-50">
                    <p class="text-xs text-gray-500 mb-2"><i class="fas fa-calendar-alt mr-1"></i>同步指定月份</p>
                    <div class="flex space-x-2">
                        <select x-model="syncTargetYear" class="flex-1 border-gray-300 rounded-lg shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50 text-sm">
                            <template x-for="y in Array.from({length: 15}, (_, i) => new Date().getFullYear() - 1911 - i)" :key="y">
                                <option :value="y" x-text="y + '年'"></option>
                            </template>
                        </select>
                        <select x-model="syncTargetMonth" class="flex-1 border-gray-300 rounded-lg shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50 text-sm">
                            <option value="全部">全年</option>
                            <template x-for="m in 12" :key="m">
                                <option :value="m + '月'" x-text="m + '月'"></option>
                            </template>
                        </select>
                        <button @click="syncData('custom'); openOptions = false" class="bg-gray-800 text-white px-3 py-2 rounded-lg hover:bg-gray-700 btn-active text-sm">
                            執行
                        </button>
                    </div>
                 </div>
              </div>
            </div>
            
            <button @click="clearLocalData()" class="w-full bg-white text-red-500 font-bold py-3 px-4 rounded-xl shadow-sm border border-red-100 hover:bg-red-50 active:bg-red-100 btn-active">
              <i class="fas fa-trash-alt mr-2"></i>清空本機快取
            </button>
        </div>
      </div>
    </div>

    <!-- 交易明細頁面 -->
    <div x-show="currentView === 'list'" x-cloak class="space-y-3">
      <!-- 搜尋與篩選列 -->
      <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex space-x-2 items-center sticky top-16 z-30">
          <div class="relative flex-1">
              <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
              <input type="text" x-model="searchQuery" placeholder="搜尋明細..." class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 text-sm">
              <button x-show="searchQuery" @click="searchQuery = ''" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"><i class="fas fa-times-circle"></i></button>
          </div>
          <select x-model="filterMonth" class="border border-gray-200 bg-gray-50 rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 max-w-[100px]">
            <option value="全部">全部月份</option>
            <template x-for="m in availableMonths" :key="m">
              <option :value="m" x-text="m"></option>
            </template>
          </select>
      </div>
        
      <!-- 明細列表 -->
      <template x-if="filteredRecords.length === 0">
        <div class="text-center py-10 bg-white rounded-xl shadow-sm border border-gray-100">
           <i class="fas fa-box-open text-4xl text-gray-300 mb-3"></i>
           <p class="text-gray-500">沒有找到符合的記錄</p>
           <button @click="currentView = 'sync'" class="mt-4 text-blue-500 text-sm hover:underline">去雲端同步看看？</button>
        </div>
      </template>

      <div class="space-y-3 pb-24">
        <template x-for="record in filteredRecords" :key="record.month + record.category + record.detail + record.amount + Math.random()">
          <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 relative group" 
               :class="{'border-green-400': record.category === '收入', 'border-red-400': record.category !== '收入' && record.category !== '系統彙總', 'border-blue-400': record.category === '系統彙總'}">
            
            <template x-if="record.category !== '系統彙總'">
                <div @click="openEditModal(record)" class="cursor-pointer">
                    <div class="flex justify-between items-start mb-1">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs font-bold px-2 py-1 bg-gray-100 rounded text-gray-600" x-text="record.category"></span>
                        <span class="text-xs text-gray-400" x-text="record.month"></span>
                    </div>
                    <span class="font-bold text-lg" :class="record.category === '收入' ? 'text-green-600' : 'text-red-500'">
                        <span x-text="record.category === '收入' ? '+' : '-'"></span>
                        <span x-text="formatCurrency(record.amount)"></span>
                    </span>
                    </div>
                    <div class="text-gray-800 mt-2 pr-8 leading-relaxed" x-text="record.detail"></div>
                    <div class="absolute right-3 bottom-3 text-gray-300 opacity-50 group-hover:opacity-100 transition-opacity"><i class="fas fa-edit"></i></div>
                </div>
            </template>

            <!-- 系統彙總特製卡片 -->
            <template x-if="record.category === '系統彙總'">
               <div>
                  <div class="flex items-center space-x-2 mb-2">
                      <span class="text-xs font-bold px-2 py-1 bg-blue-100 text-blue-700 rounded"><i class="fas fa-chart-line mr-1"></i>月結算</span>
                      <span class="text-xs text-gray-500 font-bold" x-text="record.month"></span>
                  </div>
                  <div class="grid grid-cols-3 gap-2 mt-2 border-t pt-2 border-gray-100">
                      <div class="text-center">
                          <div class="text-[10px] text-gray-400 mb-1">總收入</div>
                          <div class="text-sm font-bold text-green-600" x-text="formatCurrency(JSON.parse(record.amount).income)"></div>
                      </div>
                      <div class="text-center border-l border-r border-gray-100">
                          <div class="text-[10px] text-gray-400 mb-1">總支出</div>
                          <div class="text-sm font-bold text-red-500" x-text="formatCurrency(JSON.parse(record.amount).expense)"></div>
                      </div>
                      <div class="text-center">
                          <div class="text-[10px] text-gray-400 mb-1">結餘</div>
                          <div class="text-sm font-bold" :class="JSON.parse(record.amount).balance >= 0 ? 'text-blue-600' : 'text-orange-500'" x-text="formatCurrency(JSON.parse(record.amount).balance)"></div>
                      </div>
                  </div>
               </div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <!-- 圖表分析頁面 -->
    <div x-show="currentView === 'stats'" x-cloak class="space-y-4 pb-24">
        <!-- 控制面板 -->
        <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100 mb-4 sticky top-16 z-30">
             <div class="flex items-center justify-between mb-3">
                 <h3 class="font-bold text-gray-700"><i class="fas fa-filter text-blue-400 mr-2"></i>分析條件設定</h3>
             </div>
             
             <div class="grid grid-cols-2 gap-3 mb-3">
                 <!-- 起始月份 -->
                 <div>
                     <label class="block text-xs text-gray-500 mb-1">起始月份</label>
                     <select x-model="chartStartMonth" class="w-full bg-gray-50 border border-gray-200 text-gray-700 py-2 px-3 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                         <template x-for="m in sortedAvailableMonths" :key="'start'+m">
                             <option :value="m" x-text="m"></option>
                         </template>
                     </select>
                 </div>
                 <!-- 結束月份 -->
                 <div>
                     <label class="block text-xs text-gray-500 mb-1">結束月份</label>
                     <select x-model="chartEndMonth" class="w-full bg-gray-50 border border-gray-200 text-gray-700 py-2 px-3 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                         <template x-for="m in sortedAvailableMonths" :key="'end'+m">
                             <option :value="m" x-text="m"></option>
                         </template>
                     </select>
                 </div>
             </div>

             <!-- 圖表類型切換 -->
             <div class="flex bg-gray-100 p-1 rounded-lg">
                 <button @click="chartType = 'pie'" class="flex-1 py-1.5 text-sm font-semibold rounded-md transition-colors" :class="chartType === 'pie' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'">
                     <i class="fas fa-chart-pie mr-1"></i>支出結構
                 </button>
                 <button @click="chartType = 'trend'" class="flex-1 py-1.5 text-sm font-semibold rounded-md transition-colors" :class="chartType === 'trend' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'">
                     <i class="fas fa-chart-line mr-1"></i>收支趨勢
                 </button>
             </div>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
            <!-- 圓餅圖：支出結構 -->
            <div x-show="chartType === 'pie'">
                <h3 class="text-center font-bold text-gray-700 mb-2" x-text="getChartTitle('pie')"></h3>
                <div class="relative h-64 w-full">
                    <canvas id="expenseChart"></canvas>
                </div>
                <!-- 彙總資訊 -->
                <div class="mt-4 grid grid-cols-2 gap-2 text-center text-sm border-t pt-3">
                     <div class="bg-red-50 p-2 rounded-lg">
                         <div class="text-xs text-red-400 mb-1">期間總支出</div>
                         <div class="font-bold text-red-600" x-text="formatCurrency(periodTotalExpense)"></div>
                     </div>
                     <div class="bg-gray-50 p-2 rounded-lg">
                         <div class="text-xs text-gray-400 mb-1">平均月支出</div>
                         <div class="font-bold text-gray-600" x-text="formatCurrency(periodAvgExpense)"></div>
                     </div>
                </div>
            </div>

            <!-- 長條/折線圖：收支趨勢 -->
            <div x-show="chartType === 'trend'">
                <h3 class="text-center font-bold text-gray-700 mb-2" x-text="getChartTitle('trend')"></h3>
                <div class="relative h-72 w-full">
                    <canvas id="trendChart"></canvas>
                </div>
                <!-- 趨勢彙總資訊 -->
                <div class="mt-4 grid grid-cols-3 gap-2 text-center text-sm border-t pt-3">
                     <div class="bg-green-50 p-1.5 rounded-lg">
                         <div class="text-[10px] text-green-500 mb-0.5">總收入</div>
                         <div class="font-bold text-green-700 text-xs" x-text="formatCurrency(periodTotalIncome)"></div>
                     </div>
                     <div class="bg-red-50 p-1.5 rounded-lg">
                         <div class="text-[10px] text-red-400 mb-0.5">總支出</div>
                         <div class="font-bold text-red-600 text-xs" x-text="formatCurrency(periodTrendExpense)"></div>
                     </div>
                     <div class="p-1.5 rounded-lg" :class="periodTotalBalance >= 0 ? 'bg-blue-50' : 'bg-orange-50'">
                         <div class="text-[10px] mb-0.5" :class="periodTotalBalance >= 0 ? 'text-blue-400' : 'text-orange-400'">總結餘</div>
                         <div class="font-bold text-xs" :class="periodTotalBalance >= 0 ? 'text-blue-700' : 'text-orange-600'" x-text="formatCurrency(periodTotalBalance)"></div>
                     </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 分類設定頁面 -->
    <div x-show="currentView === 'settings'" x-cloak class="space-y-4 pb-24">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-4 border-b bg-gray-50">
          <h2 class="text-lg font-bold text-gray-800"><i class="fas fa-tags text-blue-500 mr-2"></i>支出分類管理</h2>
          <p class="text-xs text-gray-500 mt-1">此處設定的分類將用於新增記帳時的下拉選單。(不影響雲端已同步的歷史資料)</p>
        </div>
        
        <div class="p-4">
            <div class="flex space-x-2 mb-4">
              <input type="text" x-model="newCategory" placeholder="輸入新分類名稱..." class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
              <button @click="addCategory()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 btn-active font-bold whitespace-nowrap">
                新增
              </button>
            </div>

            <ul class="space-y-2 max-h-96 overflow-y-auto">
              <template x-for="(cat, index) in categories" :key="index">
                <li class="flex justify-between items-center bg-gray-50 px-4 py-3 rounded-lg border border-gray-100 group">
                  <span class="font-medium text-gray-700" x-text="cat"></span>
                  <button @click="removeCategory(cat)" class="text-red-400 hover:text-red-600 opacity-50 group-hover:opacity-100 transition-opacity p-2 btn-active">
                    <i class="fas fa-trash-alt"></i>
                  </button>
                </li>
              </template>
            </ul>
        </div>
      </div>
    </div>

  </main>

  <!-- 懸浮記帳按鈕 -->
  <button @click="openAddModal()" x-show="currentView === 'list' || currentView === 'stats'" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-xl flex items-center justify-center text-2xl hover:bg-blue-700 hover:shadow-2xl active:bg-blue-800 btn-active z-40 transition-transform hover:-translate-y-1" :class="{'bg-teal-600 hover:bg-teal-700': currentLedger === 'studio'}">
    <i class="fas fa-plus"></i>
  </button>

  <!-- 新增/編輯 帳目 Modal -->
  <div class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-end sm:items-center justify-center fade-enter" x-show="showAddModal" style="display: none;" x-transition>
    <div class="bg-white w-full sm:w-96 rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl relative max-h-[90vh] overflow-y-auto transform transition-transform" @click.away="showAddModal = false">
      <div class="absolute top-4 right-4 cursor-pointer text-gray-400 hover:text-gray-600 text-xl btn-active" @click="showAddModal = false">
        <i class="fas fa-times-circle"></i>
      </div>
      
      <h2 class="text-xl font-bold mb-5 flex items-center text-gray-800 border-b pb-2">
         <i class="fas mr-2" :class="modalMode === 'add' ? 'fa-pen text-blue-500' : 'fa-edit text-orange-500'"></i>
         <span x-text="modalMode === 'add' ? '記一筆' : '編輯記錄'"></span>
      </h2>
      
      <form @submit.prevent="submitRecord" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">收支類型</label>
              <div class="flex bg-gray-100 rounded-lg p-1">
                 <button type="button" @click="formData.type = 'expense'" class="flex-1 py-1.5 text-sm font-bold rounded-md transition-colors" :class="formData.type === 'expense' ? 'bg-white shadow text-red-500' : 'text-gray-500'">支出</button>
                 <button type="button" @click="formData.type = 'income'" class="flex-1 py-1.5 text-sm font-bold rounded-md transition-colors" :class="formData.type === 'income' ? 'bg-white shadow text-green-500' : 'text-gray-500'">收入</button>
              </div>
            </div>
            
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">日期</label>
              <input type="date" x-model="formData.date" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2" required :disabled="modalMode === 'edit'">
            </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">分類</label>
          <template x-if="formData.type === 'expense'">
              <select x-model="formData.category" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" required>
                <option value="" disabled>請選擇分類</option>
                <template x-for="cat in categories" :key="cat">
                  <option :value="cat" x-text="cat"></option>
                </template>
              </select>
          </template>
          <template x-if="formData.type === 'income'">
              <input type="text" x-model="formData.category" readonly class="bg-gray-200 border border-gray-300 text-gray-600 text-sm rounded-lg block w-full p-2.5 cursor-not-allowed text-center font-bold">
          </template>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">項目明細</label>
          <input type="text" x-model="formData.item" placeholder="例如：晚餐石二鍋" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" required>
        </div>
        
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">金額</label>
          <div class="relative">
             <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 font-bold">$</span>
             <input type="number" x-model="formData.amount" placeholder="0" class="bg-gray-50 border border-gray-300 text-gray-900 text-lg font-bold rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-8 p-2.5" required min="1">
          </div>
        </div>

        <div class="flex space-x-3 pt-4 border-t">
          <template x-if="modalMode === 'edit'">
              <button type="button" @click="deleteRecord()" class="w-1/3 text-red-500 bg-white border border-red-200 font-bold rounded-lg text-sm px-5 py-3 hover:bg-red-50 focus:outline-none btn-active">
                 刪除
              </button>
          </template>
          
          <button type="button" @click="showAddModal = false" class="flex-1 text-gray-700 bg-white border border-gray-300 font-bold rounded-lg text-sm px-5 py-3 hover:bg-gray-50 focus:outline-none btn-active" :class="modalMode === 'add' ? 'w-1/2' : ''">取消</button>
          
          <button type="submit" class="text-white font-bold rounded-lg text-sm px-5 py-3 focus:outline-none btn-active shadow-md flex justify-center items-center" 
                  :class="[
                      modalMode === 'add' ? 'w-1/2' : 'flex-1',
                      currentLedger === 'studio' ? 'bg-teal-600 hover:bg-teal-700' : 'bg-blue-600 hover:bg-blue-700'
                  ]"
                  :disabled="isLoading">
              <span x-show="!isLoading" x-text="modalMode === 'add' ? '儲存' : '更新'"></span>
              <span x-show="isLoading" class="spinner w-5 h-5 border-2"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Loading 遮罩 -->
  <div class="fixed inset-0 bg-black bg-opacity-70 z-[60] flex flex-col items-center justify-center fade-enter" x-show="isLoading" style="display: none;">
    <div class="spinner mb-4"></div>
    <p class="text-white font-bold tracking-widest animate-pulse" x-text="loadingText"></p>
  </div>

  <!-- Toast 提示 -->
  <div class="fixed top-20 left-1/2 transform -translate-x-1/2 z-[70] w-11/12 max-w-sm pointer-events-none flex flex-col items-center space-y-2">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="px-4 py-3 rounded-lg shadow-xl text-sm font-bold flex items-center toast-enter pointer-events-auto"
           :class="toast.type === 'success' ? 'bg-gray-800 text-white' : 'bg-red-500 text-white'">
        <i class="fas mr-2" :class="toast.type === 'success' ? 'fa-check-circle text-green-400' : 'fa-exclamation-circle'"></i>
        <span x-text="toast.message"></span>
      </div>
    </template>
  </div>

  <script>
    // ⚠️ 替換成你的 Google Apps Script 網頁應用程式 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz_dG59W6g2yRk1Hl_D-gZ5-2dJm7_U2bB6_x_4l-4rU_R2n6R9/exec"; 

    // 預設分類 (家用)
    const DEFAULT_CATEGORIES_HOME = [
      "食品餐飲", "治裝行頭", "居家物業", "行車交通", "教育學習", 
      "休閒娛樂", "醫療保健", "人情往來", "其他雜項", "婦嬰用品", "固定支出"
    ];
    // 預設分類 (工作室)
    const DEFAULT_CATEGORIES_STUDIO = [
      "食品餐飲", "治裝行頭", "居家物業", "行車交通", "教育學習", 
      "休閒娛樂", "醫療保健", "人情往來", "其他雜項", "婦嬰用品", "固定支出"
    ];

    document.addEventListener('alpine:init', () => {
      Alpine.data('ledgerApp', () => ({
        // 狀態變數
        currentLedger: 'home', // 'home' 或是 'studio'
        isStudioMode: false,
        menuOpen: false,
        currentView: 'list', // 'sync', 'list', 'stats', 'settings'
        isLoading: false,
        loadingText: '處理中...',
        toasts: [],
        
        // 資料變數
        records: [],
        categories: [],
        newCategory: '',
        lastSyncTime: '從未同步',
        
        // 篩選與搜尋
        searchQuery: '',
        filterMonth: '全部',
        
        // 同步選項
        syncTargetYear: new Date().getFullYear() - 1911,
        syncTargetMonth: '全部',
        
        // 圖表相關變數
        chartType: 'pie', // 'pie' 或 'trend'
        chartStartMonth: '',
        chartEndMonth: '',
        myPieChart: null,
        myTrendChart: null,

        // Modal 表單
        showAddModal: false,
        modalMode: 'add', // 'add' 或 'edit'
        formData: {
          type: 'expense', // 'expense' 或 'income'
          date: new Date().toISOString().split('T')[0],
          category: '',
          item: '',
          amount: ''
        },
        oldFormData: null, // 用於編輯時記錄原值

        initApp() {
          // 讀取帳本模式
          const savedMode = localStorage.getItem('currentLedger');
          if (savedMode === 'studio') {
              this.currentLedger = 'studio';
              this.isStudioMode = true;
          }
          this.loadLocalData();
          this.setupWatchers();
          
          // 如果沒有資料，導向同步頁
          if(this.records.length === 0) {
              this.currentView = 'sync';
          }
        },

        switchLedger() {
            this.currentLedger = this.isStudioMode ? 'studio' : 'home';
            localStorage.setItem('currentLedger', this.currentLedger);
            this.loadLocalData(); // 切換帳本時重新載入對應的資料
            this.showToast(`已切換至${this.isStudioMode ? '工作室' : '家用'}帳本`, 'success');
        },

        loadLocalData() {
          const prefix = this.currentLedger + '_';
          const storedRecords = localStorage.getItem(prefix + 'ledgerRecords');
          const storedTime = localStorage.getItem(prefix + 'lastSyncTime');
          const storedCats = localStorage.getItem(prefix + 'customCategories');
          
          if (storedRecords) this.records = JSON.parse(storedRecords);
          else this.records = [];

          if (storedTime) this.lastSyncTime = storedTime;
          else this.lastSyncTime = '從未同步';

          if (storedCats) {
            this.categories = JSON.parse(storedCats);
          } else {
            this.categories = this.currentLedger === 'home' ? [...DEFAULT_CATEGORIES_HOME] : [...DEFAULT_CATEGORIES_STUDIO];
          }

          this.initChartMonths();
          // 如果當下在圖表頁，重新渲染
          if (this.currentView === 'stats') {
              setTimeout(() => this.renderCharts(), 100);
          }
        },

        saveLocalData() {
          const prefix = this.currentLedger + '_';
          localStorage.setItem(prefix + 'ledgerRecords', JSON.stringify(this.records));
          localStorage.setItem(prefix + 'lastSyncTime', this.lastSyncTime);
          localStorage.setItem(prefix + 'customCategories', JSON.stringify(this.categories));
        },

        setupWatchers() {
          this.$watch('currentView', (value) => {
            if (value === 'stats') {
              this.initChartMonths();
              setTimeout(() => this.renderCharts(), 100);
            }
          });
          this.$watch('chartType', () => {
             if (this.currentView === 'stats') {
                 setTimeout(() => this.renderCharts(), 50);
             }
          });
          this.$watch('chartStartMonth', () => { if(this.currentView === 'stats') this.renderCharts(); });
          this.$watch('chartEndMonth', () => { if(this.currentView === 'stats') this.renderCharts(); });
          this.$watch('formData.type', (newType) => {
             if(this.modalMode === 'add') {
                 if(newType === 'income') {
                     this.formData.category = '收入';
                 } else {
                     this.formData.category = '';
                 }
             }
          });
        },

        // 判斷是否需要同步 (超過 3 天)
        isDataStale() {
            if (this.lastSyncTime === '從未同步') return true;
            try {
                // 將 "YYYY-MM-DD HH:mm:ss" 轉為可以 parse 的格式
                const dateStr = this.lastSyncTime.replace(/-/g, '/');
                const lastSyncDate = new Date(dateStr);
                const now = new Date();
                const diffTime = Math.abs(now - lastSyncDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                return diffDays > 3;
            } catch(e) {
                return true;
            }
        },

        // --- 與 Google Apps Script 溝通 ---
        async fetchGAS(action, payload = {}) {
            payload.action = action;
            payload.ledger = this.currentLedger;
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                if (result.status !== 'success') {
                    throw new Error(result.message || '發生未知錯誤');
                }
                return result;
            } catch (error) {
                console.error("API Error:", error);
                throw error;
            }
        },

        // --- 同步功能 ---
        async syncData(mode) {
          this.isLoading = true;
          this.loadingText = '連線雲端同步中...';
          try {
            let payload = {};
            if (mode === 'currentMonth') {
              const now = new Date();
              payload.targetYear = now.getFullYear() - 1911;
              payload.targetMonth = (now.getMonth() + 1) + "月";
              payload.action = 'sync_custom';
            } else if (mode === 'custom') {
              payload.targetYear = this.syncTargetYear;
              payload.targetMonth = this.syncTargetMonth;
              payload.action = 'sync_custom';
            } else {
              payload.action = 'sync';
            }
            
            const result = await this.fetchGAS(payload.action, payload);
            
            if (mode === 'all') {
                this.records = result.data;
            } else {
                // 合併資料：先移除舊的該月份資料，再加入新抓取的資料
                const monthsToUpdate = [...new Set(result.data.map(item => item.month))];
                this.records = this.records.filter(r => !monthsToUpdate.includes(r.month));
                this.records = [...result.data, ...this.records];
            }
            
            // 依月份反向排序
            this.records.sort((a, b) => {
                const partsA = a.month.match(/(\d+)年\s*(\d+)月/);
                const partsB = b.month.match(/(\d+)年\s*(\d+)月/);
                if(partsA && partsB) {
                    if (parseInt(partsA[1]) !== parseInt(partsB[1])) {
                        return parseInt(partsB[1]) - parseInt(partsA[1]);
                    }
                    return parseInt(partsB[2]) - parseInt(partsA[2]);
                }
                return 0;
            });

            const now = new Date();
            this.lastSyncTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            this.saveLocalData();
            
            this.showToast(`同步完成！共載入 ${result.data.length} 筆`, 'success');
            
            // 背景自動備份
            if(mode === 'all') {
                setTimeout(() => {
                   this.fetchGAS('auto_backup', { data: this.records }).catch(e=>console.log("背景備份失敗", e));
                }, 2000);
            }

            this.currentView = 'list';
          } catch (error) {
            this.showToast('同步失敗：' + error.message, 'error');
          } finally {
            this.isLoading = false;
          }
        },

        clearLocalData() {
          if(confirm('確定要清空手機上的快取資料嗎？（不會刪除雲端檔案）')) {
              this.records = [];
              this.lastSyncTime = '從未同步';
              this.saveLocalData();
              this.showToast('快取已清空', 'success');
          }
        },

        // --- 新增 / 編輯 / 刪除 ---
        openAddModal() {
          this.modalMode = 'add';
          const today = new Date();
          // 時區修正，確保預設日期為台灣時間
          const offset = today.getTimezoneOffset() * 60000; 
          const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];
          
          this.formData = {
            type: 'expense',
            date: localISOTime,
            category: '',
            item: '',
            amount: ''
          };
          this.showAddModal = true;
        },

        openEditModal(record) {
          // 解析 record.month 回 date 格式 (粗略，固定為當月1號，僅供顯示用)
          const mMatch = record.month.match(/(\d+)年\s*(\d+)月/);
          let dateStr = new Date().toISOString().split('T')[0];
          if (mMatch) {
              const y = parseInt(mMatch[1]) + 1911;
              const m = mMatch[2].padStart(2, '0');
              dateStr = `${y}-${m}-01`;
          }

          this.modalMode = 'edit';
          this.formData = {
             type: record.category === '收入' ? 'income' : 'expense',
             date: dateStr,
             category: record.category,
             item: record.detail,
             amount: record.amount.toString()
          };
          this.oldFormData = {
              month: record.month,
              category: record.category,
              detail: record.detail,
              amount: record.amount.toString()
          };
          this.showAddModal = true;
        },

        async submitRecord() {
          this.isLoading = true;
          this.loadingText = '上傳至雲端...';
          
          try {
             if (this.modalMode === 'add') {
                 const payload = {
                     date: this.formData.date,
                     category: this.formData.category,
                     item: this.formData.item,
                     amount: this.formData.amount
                 };
                 await this.fetchGAS('add', payload);
                 this.showToast('記帳成功！(請點擊本月同步更新圖表)', 'success');
                 
             } else {
                 const payload = {
                     month: this.oldFormData.month,
                     oldCategory: this.oldFormData.category,
                     oldDetail: this.oldFormData.detail,
                     oldAmount: this.oldFormData.amount,
                     newCategory: this.formData.category,
                     newDetail: this.formData.item,
                     newAmount: this.formData.amount
                 };
                 await this.fetchGAS('edit', payload);
                 
                 // 本地直接更新畫面 (樂觀更新)
                 const idx = this.records.findIndex(r => r.month === this.oldFormData.month && r.category === this.oldFormData.category && r.detail === this.oldFormData.detail && r.amount.toString() === this.oldFormData.amount);
                 if (idx !== -1) {
                     this.records[idx].category = this.formData.category;
                     this.records[idx].detail = this.formData.item;
                     this.records[idx].amount = this.formData.amount;
                     this.saveLocalData();
                 }
                 this.showToast('更新成功！', 'success');
             }
             this.showAddModal = false;
          } catch (error) {
             this.showToast('操作失敗：' + error.message, 'error');
          } finally {
             this.isLoading = false;
          }
        },

        async deleteRecord() {
          if(!confirm('確定要刪除這筆紀錄嗎？')) return;
          this.isLoading = true;
          this.loadingText = '從雲端刪除中...';
          try {
              const payload = {
                 month: this.oldFormData.month,
                 category: this.oldFormData.category,
                 detail: this.oldFormData.detail,
                 amount: this.oldFormData.amount
              };
              await this.fetchGAS('delete', payload);
              
              // 本地移除
              this.records = this.records.filter(r => !(r.month === this.oldFormData.month && r.category === this.oldFormData.category && r.detail === this.oldFormData.detail && r.amount.toString() === this.oldFormData.amount));
              this.saveLocalData();
              
              this.showToast('刪除成功！', 'success');
              this.showAddModal = false;
          } catch (error) {
              this.showToast('刪除失敗：' + error.message, 'error');
          } finally {
              this.isLoading = false;
          }
        },

        // --- 分類管理 ---
        addCategory() {
          if (this.newCategory && !this.categories.includes(this.newCategory)) {
            this.categories.push(this.newCategory);
            this.saveLocalData();
            this.newCategory = '';
            this.showToast('分類已新增', 'success');
          }
        },
        removeCategory(cat) {
          if (confirm(`確定要刪除「${cat}」嗎？`)) {
            this.categories = this.categories.filter(c => c !== cat);
            this.saveLocalData();
            this.showToast('分類已刪除', 'success');
          }
        },

        // --- 輔助計算 ---
        get availableMonths() {
            const months = new Set(this.records.map(r => r.month));
            return Array.from(months);
        },
        
        get sortedAvailableMonths() {
             return [...this.availableMonths].sort((a, b) => {
                const getVal = str => {
                    const m = str.match(/(\d+)年\s*(\d+)月/);
                    return m ? parseInt(m[1])*100 + parseInt(m[2]) : 0;
                };
                return getVal(a) - getVal(b); 
            });
        },

        get filteredRecords() {
            return this.records.filter(r => {
                const matchMonth = this.filterMonth === '全部' || r.month === this.filterMonth;
                const searchStr = (r.detail + ' ' + r.category + ' ' + r.amount).toLowerCase();
                const matchQuery = searchStr.includes(this.searchQuery.toLowerCase());
                return matchMonth && matchQuery;
            });
        },

        formatCurrency(num) {
            return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(num);
        },

        showToast(message, type = 'success') {
          const id = Date.now();
          this.toasts.push({ id, message, type });
          setTimeout(() => {
            this.toasts = this.toasts.filter(t => t.id !== id);
          }, 3000);
        },

        // --- 圖表功能 ---
        initChartMonths() {
            if (this.sortedAvailableMonths.length > 0) {
                // 預設看最近的三個月
                const len = this.sortedAvailableMonths.length;
                this.chartEndMonth = this.sortedAvailableMonths[len - 1];
                this.chartStartMonth = len > 3 ? this.sortedAvailableMonths[len - 3] : this.sortedAvailableMonths[0];
            }
        },
        
        getChartDataRange() {
             const getVal = str => {
                const m = str.match(/(\d+)年\s*(\d+)月/);
                return m ? parseInt(m[1])*100 + parseInt(m[2]) : 0;
            };
            const sVal = getVal(this.chartStartMonth);
            const eVal = getVal(this.chartEndMonth);
            
            // 確保起迄邏輯正確，若反了就交換
            const actualStart = Math.min(sVal, eVal);
            const actualEnd = Math.max(sVal, eVal);

            return this.records.filter(r => {
                const rVal = getVal(r.month);
                return rVal >= actualStart && rVal <= actualEnd;
            });
        },

        getChartTitle(type) {
             const mRange = this.chartStartMonth === this.chartEndMonth 
                            ? this.chartStartMonth 
                            : `${this.chartStartMonth} ~ ${this.chartEndMonth}`;
             return type === 'pie' ? `${mRange} 支出結構分析` : `${mRange} 收支趨勢分析`;
        },
        
        // 圖表彙總變數
        periodTotalExpense: 0,
        periodAvgExpense: 0,
        periodTotalIncome: 0,
        periodTrendExpense: 0,
        periodTotalBalance: 0,

        renderCharts() {
            const dataRange = this.getChartDataRange();
            if(dataRange.length === 0) return;

            // --- 圓餅圖：支出結構 ---
            if (this.chartType === 'pie') {
                const expenseData = {};
                this.periodTotalExpense = 0;
                
                // 取得區間內的所有不同月份數量，用來算平均
                const uniqueMonths = new Set(dataRange.map(r=>r.month)).size || 1;

                dataRange.forEach(r => {
                    if (r.category !== '收入' && r.category !== '系統彙總') {
                        const amt = parseFloat(r.amount) || 0;
                        expenseData[r.category] = (expenseData[r.category] || 0) + amt;
                        this.periodTotalExpense += amt;
                    }
                });
                
                this.periodAvgExpense = Math.round(this.periodTotalExpense / uniqueMonths);

                // 排序，取前7大，其餘歸入其他
                let sortedCategories = Object.entries(expenseData).sort((a,b)=>b[1]-a[1]);
                let finalLabels = [];
                let finalData = [];
                let otherSum = 0;
                
                sortedCategories.forEach((item, index) => {
                    if(index < 7) {
                        finalLabels.push(item[0]);
                        finalData.push(item[1]);
                    } else {
                        otherSum += item[1];
                    }
                });
                
                if (otherSum > 0) {
                    finalLabels.push('其他小額');
                    finalData.push(otherSum);
                }

                if (this.myPieChart) this.myPieChart.destroy();
                const ctxPie = document.getElementById('expenseChart');
                if (ctxPie) {
                    this.myPieChart = new Chart(ctxPie, {
                        type: 'doughnut',
                        data: {
                            labels: finalLabels,
                            datasets: [{
                                data: finalData,
                                backgroundColor: [
                                    '#EF4444', '#F59E0B', '#10B981', '#3B82F6', 
                                    '#8B5CF6', '#EC4899', '#14B8A6', '#9CA3AF'
                                ],
                                borderWidth: 0,
                                hoverOffset: 10
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '65%',
                            plugins: {
                                legend: { position: 'right', labels: { boxWidth: 12, font: {size: 11} } },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.label || '';
                                            if (label) label += ': ';
                                            label += new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(context.raw);
                                            return label;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }

            // --- 趨勢圖：每月收支 ---
            if (this.chartType === 'trend') {
                const monthsList = [];
                // 取出範圍內所有的系統彙總資料
                const summaryRecords = dataRange.filter(r => r.category === '系統彙總');
                
                // 依時間正序排列
                summaryRecords.sort((a, b) => {
                    const getVal = str => {
                        const m = str.match(/(\d+)年\s*(\d+)月/);
                        return m ? parseInt(m[1])*100 + parseInt(m[2]) : 0;
                    };
                    return getVal(a.month) - getVal(b.month);
                });

                const labels = [];
                const incomes = [];
                const expenses = [];
                const balances = [];
                
                this.periodTotalIncome = 0;
                this.periodTrendExpense = 0;
                this.periodTotalBalance = 0;

                summaryRecords.forEach(r => {
                    const mName = r.month.replace(/(\d+)年\s*/, ''); // 簡化為 X月
                    labels.push(mName);
                    const data = JSON.parse(r.amount);
                    incomes.push(data.income);
                    expenses.push(data.expense);
                    balances.push(data.balance);
                    
                    this.periodTotalIncome += data.income;
                    this.periodTrendExpense += data.expense;
                    this.periodTotalBalance += data.balance;
                });

                if (this.myTrendChart) this.myTrendChart.destroy();
                const ctxTrend = document.getElementById('trendChart');
                if (ctxTrend) {
                    this.myTrendChart = new Chart(ctxTrend, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: '收入',
                                    data: incomes,
                                    backgroundColor: 'rgba(16, 185, 129, 0.8)',
                                    borderRadius: 4
                                },
                                {
                                    label: '支出',
                                    data: expenses,
                                    backgroundColor: 'rgba(239, 68, 68, 0.8)',
                                    borderRadius: 4
                                },
                                {
                                    label: '結餘',
                                    data: balances,
                                    type: 'line',
                                    borderColor: '#3B82F6',
                                    backgroundColor: '#3B82F6',
                                    borderWidth: 2,
                                    pointBackgroundColor: '#fff',
                                    pointBorderColor: '#3B82F6',
                                    pointRadius: 4,
                                    fill: false,
                                    tension: 0.3
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            scales: {
                                y: { 
                                    beginAtZero: true, 
                                    grid: { color: '#f3f4f6' },
                                    ticks: {
                                        callback: function(value) {
                                            return value >= 1000 ? (value/1000) + 'k' : value;
                                        }
                                    }
                                },
                                x: { grid: { display: false } }
                            },
                            plugins: {
                                legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 6, font: {size: 11} } },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            return context.dataset.label + ': ' + new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(context.raw);
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }
        }

      }));
    });
  </script>
</body>
</html>
